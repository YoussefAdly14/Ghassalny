# Local development services. Credentials below are development-only defaults;
# override them in a root .env file (see .env.example). Never reuse them in a hosted environment.
name: ghassalny

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghassalny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghassalny_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ghassalny}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
